query DefinedAcademies($status: DefinedAcademyStatus) {
  definedAcademies(status: $status) {
    id
    slug
    name
    description
    logoUrl
    status
  }
}

query DefinedAcademyAdmin($id: Int!) {
  definedAcademy(id: $id) {
    id
    slug
    name
    description
    logoUrl
    status
    settings
  }
}

query DefinedAcademyAnalyticsSummary($academyId: Int!) {
  definedAcademyAnalyticsSummary(academyId: $academyId) {
    enrollments
    courseStarts
    lessonCompletions
    courseCompletions
    shortLinkVisits
    referralVisits
    referralRegistrations
    referralEnrollments
    activePartners
    publishedCourses
  }
}

query DefinedAcademyCoursesAdmin($academyId: Int!) {
  definedAcademyCourses(academyId: $academyId) {
    id
    slug
    title
    summary
    coverImageUrl
    visibility
    status
    estimatedDurationMinutes
    sortOrder
    publishedAt
    modules {
      id
      title
      sortOrder
      status
      lessons {
        id
        slug
        title
        lessonType
        status
        isPreview
        sortOrder
      }
    }
  }
}

query DefinedAcademyCourseAdmin($academyId: Int!, $courseId: Int!) {
  definedAcademyCourse(academyId: $academyId, courseId: $courseId) {
    id
    slug
    title
    summary
    description
    coverImageUrl
    visibility
    status
    level
    estimatedDurationMinutes
    sortOrder
    publishedAt
    modules {
      id
      title
      description
      sortOrder
      status
      lessons {
        id
        slug
        title
        summary
        lessonType
        videoUrl
        bodyContent
        status
        isPreview
        visibility
        sortOrder
      }
    }
  }
}

mutation CreateDefinedAcademyCourse(
  $academyId: Int!
  $input: CreateDefinedAcademyCourseInput!
) {
  createDefinedAcademyCourse(academyId: $academyId, input: $input) {
    id
    slug
    title
    status
  }
}

mutation UpdateDefinedAcademyCourse(
  $academyId: Int!
  $courseId: Int!
  $input: UpdateDefinedAcademyCourseInput!
) {
  updateDefinedAcademyCourse(
    academyId: $academyId
    courseId: $courseId
    input: $input
  ) {
    id
    title
    status
  }
}

mutation PublishDefinedAcademyCourse($academyId: Int!, $courseId: Int!) {
  publishDefinedAcademyCourse(academyId: $academyId, courseId: $courseId) {
    id
    status
    publishedAt
  }
}

mutation ArchiveDefinedAcademyCourse($academyId: Int!, $courseId: Int!) {
  archiveDefinedAcademyCourse(academyId: $academyId, courseId: $courseId) {
    id
    status
  }
}

