}

input CreateDefinedAcademyReferralCampaignInput {
  name: String!
  code: String
  description: String
  sourceType: DefinedAcademyReferralSourceType
  partnerId: Int
  courseId: Int
  resourceId: Int
  status: DefinedAcademyReferralCampaignStatus
  startsAt: DateTime
  endsAt: DateTime
  metadata: JSON
}

input UpdateDefinedAcademyReferralCampaignInput {
  name: String
  code: String
  description: String
  sourceType: DefinedAcademyReferralSourceType
  partnerId: Int
  courseId: Int
  resourceId: Int
  status: DefinedAcademyReferralCampaignStatus
  startsAt: DateTime
  endsAt: DateTime
  metadata: JSON
}

input ReorderDefinedAcademyItemInput {
  id: Int!
  sortOrder: Int!
}

input ReorderDefinedAcademyItemsInput {
  parentId: Int!
  items: [ReorderDefinedAcademyItemInput!]!
}

extend type DefinedAcademyCourse {
  status: DefinedAcademyCourseStatus
  publishedAt: DateTime
  level: String
}

extend type DefinedAcademyModule {
  status: DefinedAcademyContentStatus
  description: String
}

extend type DefinedAcademyLesson {
  status: DefinedAcademyContentStatus
}

extend type DefinedAcademyResource {
  status: DefinedAcademyResourceStatus
  lessonId: Int
}

extend type DefinedAcademyPartner {
  status: DefinedAcademyPartnerStatus
}

extend type Query {
  definedAcademy(id: Int!): DefinedAcademy
  definedAcademies(appId: Int, status: DefinedAcademyStatus): [DefinedAcademy!]!
  definedAcademyCourses(academyId: Int!): [DefinedAcademyCourse!]!
  definedAcademyCourse(academyId: Int!, courseId: Int!): DefinedAcademyCourse
  definedAcademyResources(academyId: Int!, lessonId: Int): [DefinedAcademyResource!]!
  definedAcademyPartners(academyId: Int!): [DefinedAcademyPartner!]!
  definedAcademyShortLinks(academyId: Int!): [DefinedAcademyShortLink!]!
  definedAcademyReferralCampaigns(
    academyId: Int!
    status: DefinedAcademyReferralCampaignStatus
  ): [DefinedAcademyReferralCampaign!]!
  definedAcademyAnalyticsSummary(academyId: Int!): DefinedAcademyAnalyticsSummary!
}

extend type Mutation {
  createDefinedAcademy(input: CreateDefinedAcademyInput!): DefinedAcademy!
  updateDefinedAcademy(id: Int!, input: UpdateDefinedAcademyInput!): DefinedAcademy!
  archiveDefinedAcademy(id: Int!): DefinedAcademy!

  createDefinedAcademyCourse(
    academyId: Int!
    input: CreateDefinedAcademyCourseInput!
  ): DefinedAcademyCourse!
  updateDefinedAcademyCourse(
    academyId: Int!
    courseId: Int!
    input: UpdateDefinedAcademyCourseInput!
  ): DefinedAcademyCourse!
  publishDefinedAcademyCourse(academyId: Int!, courseId: Int!): DefinedAcademyCourse!
  archiveDefinedAcademyCourse(academyId: Int!, courseId: Int!): DefinedAcademyCourse!
  reorderDefinedAcademyCourses(
    academyId: Int!
    input: ReorderDefinedAcademyItemsInput!
  ): [DefinedAcademyCourse!]!

  createDefinedAcademyModule(
    academyId: Int!
    courseId: Int!
    input: CreateDefinedAcademyModuleInput!
  ): DefinedAcademyModule!
  updateDefinedAcademyModule(
    academyId: Int!
    moduleId: Int!
    input: UpdateDefinedAcademyModuleInput!
  ): DefinedAcademyModule!
  reorderDefinedAcademyModules(
    academyId: Int!
    input: ReorderDefinedAcademyItemsInput!
  ): [DefinedAcademyModule!]!

  createDefinedAcademyLesson(
    academyId: Int!
    moduleId: Int!
    input: CreateDefinedAcademyLessonInput!
  ): DefinedAcademyLesson!
  updateDefinedAcademyLesson(
    academyId: Int!
    lessonId: Int!
    input: UpdateDefinedAcademyLessonInput!
  ): DefinedAcademyLesson!
  publishDefinedAcademyLesson(academyId: Int!, lessonId: Int!): DefinedAcademyLesson!
  reorderDefinedAcademyLessons(
    academyId: Int!
    input: ReorderDefinedAcademyItemsInput!
  ): [DefinedAcademyLesson!]!

  createDefinedAcademyResource(
    academyId: Int!
    input: CreateDefinedAcademyResourceInput!
  ): DefinedAcademyResource!
  updateDefinedAcademyResource(
    academyId: Int!
    resourceId: Int!
    input: UpdateDefinedAcademyResourceInput!
  ): DefinedAcademyResource!
  archiveDefinedAcademyResource(
    academyId: Int!
    resourceId: Int!
  ): DefinedAcademyResource!

  createDefinedAcademyPartnerCategory(
    academyId: Int!
    input: CreateDefinedAcademyPartnerCategoryInput!
  ): DefinedAcademyPartnerCategory!
  createDefinedAcademyPartner(
    academyId: Int!
    input: CreateDefinedAcademyPartnerInput!
  ): DefinedAcademyPartner!
  updateDefinedAcademyPartner(
    academyId: Int!
    partnerId: Int!
    input: UpdateDefinedAcademyPartnerInput!
  ): DefinedAcademyPartner!

  createDefinedAcademyShortLink(
    academyId: Int!
    input: CreateDefinedAcademyShortLinkInput!
  ): DefinedAcademyShortLink!
  disableDefinedAcademyShortLink(
    academyId: Int!
    shortLinkId: Int!
  ): DefinedAcademyShortLink!

  createDefinedAcademyReferralCampaign(
    academyId: Int!
    input: CreateDefinedAcademyReferralCampaignInput!
  ): DefinedAcademyReferralCampaign!
  updateDefinedAcademyReferralCampaign(
    academyId: Int!
    campaignId: Int!
    input: UpdateDefinedAcademyReferralCampaignInput!
  ): DefinedAcademyReferralCampaign!
}

# ---------------------------------------------------------------------------
# Data Audit Lab (internal admin)
# ---------------------------------------------------------------------------

enum DataAuditRunStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
}

enum DataAuditFindingStatus {
  OPEN
  REVIEWED
  ACCEPTED_RISK
  FALSE_POSITIVE
  FIXED
}

enum DataAuditFieldClassification {
  PUBLIC
  PERSONAL
  INTERNAL
  SENSITIVE
  SECURITY_RELEVANT
  UNKNOWN
}

type DataAuditRun {
  id: Int!
  status: DataAuditRunStatus!
  source: String!
  sourceBaseUrl: String
  startedAt: DateTime
  completedAt: DateTime
  failedAt: DateTime
  requestedByUserId: Int
  requestedByName: String
  requestedByEmail: String
  requestCount: Int!
  profileCount: Int!
  agentCount: Int!
  lenderCount: Int!
  newProfileCount: Int!
  changedProfileCount: Int!
  removedProfileCount: Int!
  discrepancyCount: Int!
  exposureFindingCount: Int!
  schemaFieldCount: Int!
  errorMessage: String
  overviewMetrics: JSON
  contentInsights: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DataAuditOverview {
  lastSuccessfulAuditAt: DateTime
  currentStatus: DataAuditRunStatus
  currentRunId: Int
  overviewMetrics: JSON
  contentInsights: JSON
  latestRun: DataAuditRun
}

type DataAuditProfileListItem {
  id: Int!
  auditRunId: Int!
  sourceProfileId: String!
  slug: String
  displayName: String
  avatarUrl: String
  avatarPath: String
  agentType: String
  agencyName: String
  yearsInBusiness: Float
  yearsInArea: Float
  contractsCompleted: Float
  states: JSON
  cities: JSON
  clientSpecializations: JSON
  propertyTypes: JSON
  isVerified: Boolean
  isPublic: Boolean
  isProfileComplete: Boolean
  profileCompleteness: Float
  hasEmail: Boolean!
  hasPhone: Boolean!
  hasDocumentReferences: Boolean!
  documentReferenceCount: Int!
  findingCount: Int!
  highestSeverity: String
}

type DataAuditProfileConnection {
  auditRunId: Int
  total: Int!
  items: [DataAuditProfileListItem!]!
}

type DataAuditFindingProfileRef {
  id: Int!
  displayName: String
  slug: String
  agentType: String
}

type DataAuditFinding {
  id: Int!
  auditRunId: Int!
  profileId: Int
  category: String!
  severity: String!
  status: DataAuditFindingStatus!
  ruleCode: String!
  title: String!
  description: String!
  fieldPath: String
  expectedValue: JSON
  actualValue: JSON
  recommendation: String
  reviewNote: String
  reviewedByUserId: Int
  reviewedAt: DateTime
  createdAt: DateTime!
  profile: DataAuditFindingProfileRef
}

type DataAuditFindingConnection {
  auditRunId: Int
  total: Int!
  items: [DataAuditFinding!]!
}

type DataAuditProfileDetail {
  id: Int!
  auditRunId: Int!
  sourceProfileId: String!
  slug: String
  firstName: String
  lastName: String
  displayName: String
  avatarUrl: String
  avatarPath: String
  agentType: String
  agencyName: String
  yearsInBusiness: Float
  yearsInArea: Float
  contractsCompleted: Float
  states: JSON
  cities: JSON
  clientSpecializations: JSON
  propertyTypes: JSON
  pricePoints: JSON
  loanTypes: JSON
  certifications: JSON
  documentReferenceCount: Int!
  isPublic: Boolean
  isVerified: Boolean
  verificationStatus: String
  isProfileComplete: Boolean
  profileCompleteness: Float
  hasEmail: Boolean!
  hasPhone: Boolean!
  hasVerificationNote: Boolean!
  hasVerifiedBy: Boolean!
  hasDocumentReferences: Boolean!
  hasTokenLikeFields: Boolean!
  normalizedPayload: JSON
  rawMasked: JSON
  findings: [DataAuditFinding!]!
}

type DataAuditSchemaField {
  id: Int!
  auditRunId: Int!
  fieldPath: String!
  detectedTypes: JSON!
  occurrenceCount: Int!
  profileCoverage: Float!
  classification: DataAuditFieldClassification!
  expectedPublic: Boolean
  academyUseful: Boolean
  sampleValueMasked: String
  notes: String
}

input DataAuditProfilesFilterInput {
  auditRunId: Int
  search: String
  agentType: String
  isVerified: Boolean
  isPublic: Boolean
  isProfileComplete: Boolean
  hasEmail: Boolean
  hasPhone: Boolean
  hasDocumentReferences: Boolean
  skip: Int
  take: Int
}

input DataAuditFindingsFilterInput {
  auditRunId: Int
  category: String
  severity: String
  status: String
  ruleCode: String
  exposureOnly: Boolean
  skip: Int
  take: Int
}

input UpdateDataAuditFindingStatusInput {
  status: DataAuditFindingStatus!
  reviewNote: String
}

input UpdateDataAuditSchemaFieldInput {
  classification: DataAuditFieldClassification
  expectedPublic: Boolean
  academyUseful: Boolean
  notes: String
}

input CreateDataAuditShareInput {
  auditRunId: Int
  title: String
  recipientName: String
  personalMessage: String
  inviteCtaLabel: String
  invitePath: String
  expiresInDays: Int
}

type DataAuditShareLink {
  id: Int!
  auditRunId: Int!
  token: String!
  title: String!
  recipientName: String
  personalMessage: String
  inviteCtaLabel: String
  invitePath: String
  shareUrl: String!
  viewCount: Int!
  lastViewedAt: DateTime
  expiresAt: DateTime
  revokedAt: DateTime
  createdAt: DateTime!
  isActive: Boolean!
}

type DataAuditSharePublic {
  title: String!
  recipientName: String
  personalMessage: String
  inviteCtaLabel: String!
  inviteUrl: String!
  expiresAt: DateTime
  report: JSON!
}

extend type Query {
  dataAuditOverview: DataAuditOverview!
  dataAuditRuns(take: Int): [DataAuditRun!]!
  dataAuditRun(id: Int!): DataAuditRun
  dataAuditProfiles(filter: DataAuditProfilesFilterInput): DataAuditProfileConnection!
  dataAuditProfile(id: Int!, includeRaw: Boolean): DataAuditProfileDetail
  dataAuditSchemaFields(auditRunId: Int): [DataAuditSchemaField!]!
  dataAuditFindings(filter: DataAuditFindingsFilterInput): DataAuditFindingConnection!
  dataAuditShares(take: Int): [DataAuditShareLink!]!
  dataAuditSharePublic(token: String!): DataAuditSharePublic!
}

extend type Mutation {
  startDataAuditRun: DataAuditRun!
  updateDataAuditFindingStatus(
    id: Int!
    input: UpdateDataAuditFindingStatusInput!
  ): DataAuditFinding!
  updateDataAuditSchemaField(
    id: Int!
    input: UpdateDataAuditSchemaFieldInput!
  ): DataAuditSchemaField!
  createDataAuditShareLink(input: CreateDataAuditShareInput): DataAuditShareLink!
  revokeDataAuditShareLink(id: Int!): DataAuditShareLink!
}
